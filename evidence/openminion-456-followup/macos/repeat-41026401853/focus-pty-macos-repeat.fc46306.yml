name: focus-pty-macos-repeat
run-name: "focus-pty-macos repeat (${{ github.sha }})"

# Repeats openminion's ci.yml `focus-pty-macos` job (same runner label, same
# actions, same venv bootstrap, same four tests and PYTHONPATH) on a PR head
# and on dev as the control. Each matrix job runs the four tests ITERATIONS
# times. A diagnostics-only pytest plugin (focus_dump.py, this branch) saves
# the raw PTY output, the harness actions and the final emulator screen of the
# resize test and of any failing session; it changes no test or assertion.
on:
  push:
    branches: [macos-focus-pty]
  workflow_dispatch:

permissions:
  contents: read

env:
  ITERATIONS: "8"

jobs:
  repeat:
    name: ${{ matrix.target }} shard ${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [pr535, pr534, dev]
        shard: [1, 2, 3]
        include:
          - target: pr535
            repo: AliceMessi/openminion
            ref: f7f27c92a33f4679208d5bac42fd14e436928c6a
          - target: pr534
            repo: AliceMessi/openminion
            ref: 02f25bfe3648ccab1b895e499231ab695bddb475
          - target: dev
            repo: openminion/openminion
            ref: f7b6100ae06f326399942fed04e5f5f95e5f70b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .focus-tools
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Prepare isolated runtime roots
        run: |
          {
            echo "OPENMINION_HOME=$RUNNER_TEMP/openminion-home"
            echo "OPENMINION_DATA_ROOT=$RUNNER_TEMP/openminion-data"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/openminion-pycache"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/openminion-home" "$RUNNER_TEMP/openminion-data"
      - name: Bootstrap repo venv
        run: |
          python -m venv .venv
          .venv/bin/python3.11 -m pip install --upgrade pip setuptools wheel
          .venv/bin/python3.11 -m pip install -e ".[dev]"
      - name: Environment
        run: |
          git log --oneline -1
          sw_vers
          uname -a
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-} RUNNER_NAME=${RUNNER_NAME:-}"
          sysctl -n hw.ncpu hw.memsize
          .venv/bin/python3.11 -c 'import sys, pyte, prompt_toolkit; print("CPython", sys.version.split()[0], "pyte", getattr(pyte, "__version__", "?"), "prompt_toolkit", prompt_toolkit.__version__)'
      - name: Run macOS Focus PTY layout and paste smoke, repeated
        env:
          PYTHONPATH: src:.focus-tools
          FOCUS_DUMP_DIR: ${{ runner.temp }}/focus-dump
        run: |
          set +e
          mkdir -p "$FOCUS_DUMP_DIR"
          failed=0
          for i in $(seq 1 "$ITERATIONS"); do
            export FOCUS_ITER="${{ matrix.target }}-s${{ matrix.shard }}-i$i"
            .venv/bin/python3.11 -m pytest -q -p focus_dump \
              tests/e2e/cli/focus/test_local.py::test_focus_full_slash_menu_preserves_visible_transcript \
              tests/e2e/cli/focus/test_local.py::test_focus_pty_keeps_top_down_transcript_with_inline_input_across_resize \
              'tests/e2e/cli/focus/test_local.py::test_focus_pty_multiline_paste_waits_for_enter_and_submits_once[plain-cr]' \
              'tests/e2e/cli/focus/test_local.py::test_focus_pty_multiline_paste_waits_for_enter_and_submits_once[bracketed]' \
              > "$FOCUS_DUMP_DIR/$FOCUS_ITER.pytest.txt" 2>&1
            rc=$?
            echo "RESULT $FOCUS_ITER exit=$rc $(tail -1 "$FOCUS_DUMP_DIR/$FOCUS_ITER.pytest.txt")"
            grep -E "^FAILED|^E  " "$FOCUS_DUMP_DIR/$FOCUS_ITER.pytest.txt" | cut -c1-300 | head -6
            [ "$rc" -ne 0 ] && failed=$((failed + 1))
          done
          echo "SUMMARY ${{ matrix.target }} shard ${{ matrix.shard }} ref ${{ matrix.ref }}: $failed of $ITERATIONS iterations failed"
          [ "$failed" -eq 0 ]
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus-dump-${{ matrix.target }}-s${{ matrix.shard }}
          path: ${{ runner.temp }}/focus-dump
          retention-days: 14
