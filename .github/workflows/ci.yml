name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Unit and offline integration tests
        run: python -m pytest -q
      # The offline probes use the built-in fake provider: no keys, no network calls to model providers.
      # Findings (FAIL rows) are data, so this step only fails if the run itself crashes.
      - name: Offline probe run (openminion pinned to 0.1.8)
        run: python -m minionprobe run --providers local --out ci-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-${{ matrix.os }}
          path: ci-results
          retention-days: 14
