[project]
name = "minionprobe"
version = "0.1.0"
description = "A probe suite for the OpenMinion SDK: one probe per building block, run against real providers, with a provider x building-block matrix and drafted issue reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AliceMessi" }]
dependencies = [
    "openminion==0.1.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
minionprobe = "minionprobe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minionprobe*"]

[tool.setuptools.package-data]
minionprobe = ["skills/*/SKILL.md", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs the real OpenMinion runtime against the local fake provider (offline, slower)",
]
